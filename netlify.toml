# Netlify hosts the MYNAIRATRACK frontend (Vite SPA) only.
# The FastAPI backend + PostgreSQL must be deployed separately
# (see DEPLOY.md — e.g. Render). Set VITE_API_URL in the Netlify
# site settings to the public backend URL before deploying.

[build]
  base = "frontend/"
  command = "npm run build"
  publish = "dist/"

# Hash-routed SPA (#/...) still needs a fallback for direct visits.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must always be fresh, or updates get stuck behind cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
